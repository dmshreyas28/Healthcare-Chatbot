version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=llama2:7b
      - ENABLE_RAG=true
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - VECTOR_DB_PATH=/app/chroma_db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend/chroma_db:/app/chroma_db
    networks:
      - healthcare-network
    restart: unless-stopped
    depends_on:
      - frontend

  frontend:
    image: nginx:alpine
    container_name: healthcare-chatbot-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - healthcare-network
    restart: unless-stopped

networks:
  healthcare-network:
    driver: bridge
